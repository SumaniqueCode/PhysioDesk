[project]
name = "physiodesk-backend"
version = "0.1.0"
description = "PhysioDesk clinic management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.0",
  "pydantic[email]>=2.0",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated migrations are not hand-linted; env.py is still checked.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ dir shadows the package; classify it as third-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
