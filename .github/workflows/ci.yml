name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: physiodesk
          POSTGRES_PASSWORD: physiodesk
          POSTGRES_DB: physiodesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-backend

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        env:
          # Integration tests run against the postgres service database above;
          # conftest supplies a default JWT_SECRET so none is needed here.
          TEST_DATABASE_URL: postgresql+asyncpg://physiodesk:physiodesk@localhost:5432/physiodesk_test
        run: pytest -q

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-frontend

      - name: Lint (eslint)
        run: npm run lint

      # next typegen writes .next/types (LayoutProps/PageProps) that tsc needs.
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        run: npm run build
