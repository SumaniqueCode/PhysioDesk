name: Setup frontend Node
description: Install Node 20 with npm caching and install frontend dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    # npm install (not ci): the committed lockfile is generated on Windows and
    # omits Linux-only optional binaries that the runner needs to resolve.
    - name: Install dependencies
      run: npm install --no-audit --no-fund
      shell: bash
      working-directory: frontend
