# PostgreSQL for local development and reviewers.
# Backend and frontend services are added in their respective parts.
services:
  db:
    image: postgres:16-alpine
    container_name: physiodesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-physiodesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physiodesk}
      POSTGRES_DB: ${POSTGRES_DB:-physiodesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - physiodesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-physiodesk} -d ${POSTGRES_DB:-physiodesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  physiodesk_pgdata:
